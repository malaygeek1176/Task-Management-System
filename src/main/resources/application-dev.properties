# ==============================
# Dev profile overrides
# ==============================

# Show SQL in logs (development only)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Auto-update schema in dev (do NOT use 'update' or 'create' in production)
spring.jpa.hibernate.ddl-auto=update

# Verbose logging for our own package and Spring Security while developing
logging.level.com.taskmanagement=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Detailed error responses while developing
server.error.include-message=always
server.error.include-binding-errors=always
