# ==============================
# Application
# ==============================
spring.application.name=task-management-application
server.port=${SERVER_PORT:8080}

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================
# Datasource (PostgreSQL)
# ==============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanagement}
spring.datasource.username=${DB_USERNAME: db name}
spring.datasource.password=${DB_PASSWORD:db pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==============================
# JWT
# ==============================
# 256-bit (32+ char) secret. Override in production via JWT_SECRET env var.
app.jwt.secret=${JWT_SECRET:task-management-application-dev-secret-key-2026-very-secure}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================
# Default admin seed account (optional)
# ==============================
app.admin.email=${ADMIN_EMAIL:admin@taskmanagement.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.first-name=${ADMIN_FIRST_NAME:System}
app.admin.last-name=${ADMIN_LAST_NAME:Administrator}
app.admin.seed-enabled=${ADMIN_SEED_ENABLED:true}

# ==============================
# Swagger / OpenAPI
# ==============================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ==============================
# Jackson
# ==============================
spring.jackson.default-property-inclusion=non_null
#spring.jackson.serialization.write-dates-as-timestamps=false delete by gpt
